# Skyview — production compose. Uses an external managed Postgres (Neon) by
# default; a local postgres service is included (commented) if you'd rather
# self-host the DB.
#
#   1. cp api/.env.production.example api/.env      (fill in real values)
#   2. docker compose build
#   3. docker compose run --rm api pnpm prisma:migrate:deploy
#   4. docker compose run --rm api pnpm seed:org && docker compose run --rm api pnpm seed:admin
#   5. docker compose up -d
#
# See DEPLOY.md for the full runbook.

services:
  api:
    build: ./api
    env_file:
      - ./api/.env
    ports:
      - "5000:5000"
    restart: unless-stopped
    # depends_on: [db]   # uncomment if using the local db service below

  web:
    build:
      context: ./web
      args:
        # Baked at build time. Point at the public API URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - api

  # --- Optional self-hosted Postgres (default is external Neon) ---
