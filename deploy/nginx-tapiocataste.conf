# Production nginx config for tapiocataste.com (apex + www): static landing
# page. The app moved to app.tapiocataste.com — see nginx-app-tapiocataste.conf.
#
# This file REPLACES the live /etc/nginx/sites-available/tapiocataste, which
# certbot had already rewritten with a 443/SSL block for tapiocataste.com +
# www.tapiocataste.com. The ssl_certificate / redirect blocks below are
# copied verbatim from that live file — installing this does NOT require a
# new certbot run, the existing cert is reused as-is.
#
# Install (deploy/sudo-setup-app-subdomain.sh does this):
#   sudo cp deploy/nginx-tapiocataste.conf /etc/nginx/sites-available/tapiocataste
#   sudo nginx -t && sudo systemctl reload nginx

server {
  server_name tapiocataste.com www.tapiocataste.com;

  root /var/www/skyview/landing;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tapiocataste.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tapiocataste.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.tapiocataste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = tapiocataste.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name tapiocataste.com www.tapiocataste.com;
    return 404; # managed by Certbot




}
