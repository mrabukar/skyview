# Production nginx config for tapiocataste.com (Skyview: web + API on one domain).
# Install:
#   sudo cp deploy/nginx-tapiocataste.conf /etc/nginx/sites-available/tapiocataste
#   sudo ln -s /etc/nginx/sites-available/tapiocataste /etc/nginx/sites-enabled/tapiocataste
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d tapiocataste.com -d www.tapiocataste.com
# (certbot rewrites this file in place to add the 443/SSL block + http->https redirect.)

server {
  listen 80;
  listen [::]:80;
  server_name tapiocataste.com www.tapiocataste.com;

  client_max_body_size 20m;

  # Backend — NestJS already serves everything under /api itself
  # (app.setGlobalPrefix("api")), so pass the URI through unchanged.
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend — Next.js
  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
