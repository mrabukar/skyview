# Production nginx config for app.tapiocataste.com (Skyview: web + API).
# The app moved here from the apex — see nginx-tapiocataste.conf for the
# landing page that now lives at tapiocataste.com / www.tapiocataste.com.
#
# Install:
#   sudo cp deploy/nginx-app-tapiocataste.conf /etc/nginx/sites-available/tapiocataste-app
#   sudo ln -s /etc/nginx/sites-available/tapiocataste-app /etc/nginx/sites-enabled/tapiocataste-app
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.tapiocataste.com
# (certbot rewrites this file in place to add the 443/SSL block + http->https redirect.)

server {
  listen 80;
  listen [::]:80;
  server_name app.tapiocataste.com;

  client_max_body_size 20m;

  # Backend — NestJS already serves everything under /api itself
  # (app.setGlobalPrefix("api")), so pass the URI through unchanged.
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Frontend — Next.js
  location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
